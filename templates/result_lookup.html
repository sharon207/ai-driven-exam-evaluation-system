<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look Up Exam Results</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Look Up Exam Results</h1>
        <div class="card p-4 mt-4">
            <form action="/results" method="GET" id="lookupForm">
                <div class="form-group">
                    <label for="student_id">Student ID:</label>
                    <input type="text" class="form-control" id="student_id" name="student_id" required>
                </div>
                
                <div class="form-group">
                    <label for="exam_id">Exam ID:</label>
                    <input type="text" class="form-control" id="exam_id" name="exam_id" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Look Up Results</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('lookupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentId = document.getElementById('student_id').value;
            const examId = document.getElementById('exam_id').value;
            window.location.href = `/results/${studentId}/${examId}`;
        });
    </script>
</body>
</html>
