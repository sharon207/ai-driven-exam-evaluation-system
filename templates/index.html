<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Signup</title>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBuFipjljkZsxbxHY2CPXXCea8AUhE45Gc",
            authDomain: "ai-exam-5d7ee.firebaseapp.com",
            projectId: "ai-exam-5d7ee",
            storageBucket: "ai-exam-5d7ee.appspot.com",
            messagingSenderId: "260157194951",
            appId: "1:260157194951:web:88fc5359d25197e64cb4e2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Signup Function
        window.signup = async function () {
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            try {
                const userCredential =
                    await createUserWithEmailAndPassword(auth, email, password);

                await userCredential.user.getIdToken();

                window.location.href = "http://127.0.0.1:5000/login";
            } catch (error) {
                alert(error.message);
            }
        };

        // Login Function
        window.login = async function () {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const userCredential =
                    await signInWithEmailAndPassword(auth, email, password);

                await userCredential.user.getIdToken();

                window.location.href = "http://127.0.0.1:5000/login";
            } catch (error) {
                alert(error.message);
            }
        };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;

            /* Center everything */
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
            color: #007bff;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;

            border: 1px solid #007bff;
            border-radius: 5px;

            font-size: 14px;
        }

        input:focus {
            border-color: #0056b3;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;

            background-color: #007bff;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .form-section {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Login Section -->
        <div class="form-section">
            <h2>Login</h2>

            <input type="email" id="loginEmail" placeholder="Email" />
            <input type="password" id="loginPassword" placeholder="Password" />

            <button onclick="login()">Login</button>
        </div>

        <!-- Signup Section -->
        <div class="form-section">
            <h2>Signup</h2>

            <input type="email" id="signupEmail" placeholder="Email" />
            <input type="password" id="signupPassword" placeholder="Password" />

            <button onclick="signup()">Signup</button>
        </div>

    </div>

</body>
</html>
